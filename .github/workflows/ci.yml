name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # GitHub-hosted runners do not expose a supported NVIDIA device. The
      # empirical pipeline still runs end to end here, using its explicit CPU
      # mode. CUDA is exercised by the separate, manually dispatched GPU job.
      YOUTUBE_CLIPPER_E2E_DEVICE: cpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Source lint
        run: python -m ruff check src --select E9,F
      - name: Static typing
        run: pyright src
      - name: Dependency vulnerability audit
        run: python -m pip_audit
      - name: Full functional test suite
        run: python -m pytest tests -q -m "not performance"

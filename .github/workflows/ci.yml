name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GitHub-hosted runners do not expose a supported NVIDIA device. The
      # empirical pipeline still runs end to end here, using its explicit CPU
      # mode. CUDA is exercised by the separate, manually dispatched GPU job.
      YOUTUBE_CLIPPER_E2E_DEVICE: cpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Generate OpenAPI client
        working-directory: web
        run: npm run generate:api
      - name: TypeScript
        working-directory: web
        run: npx tsc --noEmit
      - name: Vitest
        working-directory: web
        run: npm test
      - name: Build Vite
        working-directory: web
        run: npx vite build
      - name: Python tests
        run: python -m pytest tests -q --ignore=tests/test_dashboard_preview_api.py
      - name: Physical media tests
        run: python -m pytest tests/test_dashboard_preview_api.py -q

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright
        working-directory: web
        run: npm run test:e2e
      - name: Preserve Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: review/UI-7/runs/playwright
          if-no-files-found: error
          retention-days: 14

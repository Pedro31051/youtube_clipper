name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GitHub-hosted runners do not expose a supported NVIDIA device. The
      # empirical pipeline still runs end to end here, using its explicit CPU
      # mode. CUDA is exercised by the separate, manually dispatched GPU job.
      YOUTUBE_CLIPPER_E2E_DEVICE: cpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Contract tests
        run: python -m pytest tests/test_contracts.py -q
      - name: T0 remediation regressions
        run: python -m pytest tests/test_t0_remediations.py -q
      - name: Full test suite
        run: python -m pytest tests -q

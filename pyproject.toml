[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-clipper"
version = "0.1.0"
description = "CLI tool for automated YouTube video clipping and extraction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2023.3.4",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "faster-whisper>=1.0.0",
    "scenedetect>=0.6.0",
    "pysubs2>=1.6.0",
    "pyloudnorm>=0.1.1",
    "soundfile>=0.12.0",
    "fastapi>=0.140.8,<0.141",
    "uvicorn>=0.51.0,<0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27,<1",
]
gpu = [
    "nvidia-cublas-cu12>=12.9; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[project.scripts]
youtube-clipper-dashboard = "youtube_clipper.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_clipper = ["templates/*.html"]

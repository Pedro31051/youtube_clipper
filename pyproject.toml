[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-clipper"
version = "0.1.0"
description = "CLI tool for automated YouTube video clipping and extraction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2023.3.4",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

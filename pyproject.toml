[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-clipper"
version = "0.1.0"
description = "CLI tool for automated YouTube video clipping and extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2023.3.4",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "faster-whisper>=1.0.0",
    "scenedetect>=0.6.0",
    "pysubs2>=1.6.0",
    "pyloudnorm>=0.1.1",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.12.0",
    "pyright>=1.1.400",
    "pip-audit>=2.9.0",
]
gpu = [
    "nvidia-cublas-cu12>=12.9; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
markers = [
    "performance: hardware-dependent empirical performance benchmarks",
]

[tool.setuptools.packages.find]
where = ["src"]
